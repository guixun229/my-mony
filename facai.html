<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>发财 - 像素记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Zpix';
      src: url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-font/dist/Zpix.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-font/dist/Zpix.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-font/dist/Zpix.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg: #e0e0e0;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-light: #666;
      --border: #1a1a2e;
      --income: #2d6a4f;
      --income-bg: #d8f3dc;
      --expense: #9d0208;
      --expense-bg: #ffe5e5;
      --accent: #0353a4;
      --yellow: #ffd60a;
      --salary: #b8860b;
      --salary-bg: #fff8dc;
      --font-pixel: 'Press Start 2P', 'Zpix', monospace;
      --font-text: 'Zpix', 'DotGothic16', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-text);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(26,26,46,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,26,46,0.03) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
    }

    /* Views */
    .view {
      display: none;
      padding: 0 16px 32px;
      min-height: 100vh;
    }
    .view.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
    }

    .app-header h1 {
      font-family: var(--font-text);
      font-size: 28px;
      font-weight: normal;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-family: var(--font-text);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 0;
    }

    .back-btn:active {
      transform: translate(2px, 2px);
    }

    .title-center {
      font-size: 20px;
      letter-spacing: 2px;
    }

    /* Menu */
    .menu-wrapper { position: relative; }

    .settings-wrapper { position: relative; display: inline-block; }

    .settings-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .settings-btn:active { transform: translate(2px, 2px); }

    .settings-dropdown {
      top: 42px;
      left: 0;
    }

    .update-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff0000;
      border-radius: 50%;
      margin-left: auto;
    }

    .menu-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 0;
    }

    .menu-btn span {
      display: block;
      width: 16px;
      height: 2px;
      background: var(--border);
    }

    .dropdown {
      position: absolute;
      top: 42px;
      right: 0;
      background: var(--card-bg);
      border: 2px solid var(--border);
      min-width: 130px;
      z-index: 100;
      box-shadow: 4px 4px 0 rgba(26,26,46,0.15);
    }

    .dropdown a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--text);
      border-bottom: 2px solid #eee;
      font-size: 16px;
      cursor: pointer;
    }

    .dropdown a:last-child { border-bottom: none; }
    .dropdown a:hover { background: #f5f5f5; }
    .hidden { display: none !important; }

    /* Balance summary */
    .balance-summary {
      text-align: center;
      padding: 12px 0 20px;
    }

    .balance-summary .label {
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .balance-summary .amount {
      font-family: var(--font-pixel);
      font-size: 18px;
    }

    .balance-summary .amount.positive { color: var(--income); }
    .balance-summary .amount.negative { color: var(--expense); }

    /* Balance boxes */
    .balance-box {
      border: 3px solid var(--border);
      padding: 20px;
      margin-bottom: 16px;
      background: var(--card-bg);
      cursor: pointer;
      position: relative;
      box-shadow: 4px 4px 0 var(--border);
      transition: all 0.08s;
    }

    .balance-box:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--border);
    }

    .box-label {
      font-family: var(--font-pixel);
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .box-amount {
      font-family: var(--font-pixel);
      font-size: 22px;
    }

    .box-sub {
      font-size: 14px;
      color: var(--text-light);
      margin-top: 8px;
    }

    .balance-box.income { border-color: var(--income); box-shadow: 4px 4px 0 var(--income); }
    .balance-box.income .box-label { color: var(--income); }
    .balance-box.income .box-amount { color: var(--income); }

    .balance-box.expense { border-color: var(--expense); box-shadow: 4px 4px 0 var(--expense); }
    .balance-box.expense .box-label { color: var(--expense); }
    .balance-box.expense .box-amount { color: var(--expense); }

    /* Salary box - smaller */
    .salary-box {
      border: 2px solid var(--salary);
      padding: 14px 18px;
      margin-bottom: 16px;
      background: var(--salary-bg);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--salary);
      transition: all 0.08s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .salary-box:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--salary);
    }

    .salary-box-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .salary-box-label {
      font-family: var(--font-pixel);
      font-size: 10px;
      color: var(--salary);
    }

    .salary-box-sub {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .salary-history-link {
      font-size: 13px;
      color: var(--expense);
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 8px;
    }

    .salary-history-link:active { opacity: 0.6; }

    /* Pixel coin icon */
    .pixel-coin {
      width: 24px;
      height: 24px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Form */
    .type-banner {
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
      border: 3px solid var(--border);
      font-family: var(--font-pixel);
      font-size: 14px;
    }

    .type-banner.income {
      background: var(--income-bg);
      color: var(--income);
      border-color: var(--income);
    }

    .type-banner.expense {
      background: var(--expense-bg);
      color: var(--expense);
      border-color: var(--expense);
    }

    .type-banner.salary {
      background: var(--salary-bg);
      color: var(--salary);
      border-color: var(--salary);
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-family: var(--font-pixel);
      font-size: 8px;
      margin-bottom: 8px;
      color: var(--text-light);
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="date"],
    .form-group select {
      width: 100%;
      padding: 14px 12px;
      border: 2px solid var(--border);
      font-family: var(--font-text);
      font-size: 18px;
      background: var(--card-bg);
      outline: none;
      color: var(--text);
    }

    .form-group input[type="date"] {
      font-family: var(--font-text);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    .amount-input-wrapper {
      position: relative;
    }

    .amount-input-wrapper::before {
      content: '¥';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-pixel);
      font-size: 16px;
      color: var(--text);
      z-index: 1;
    }

    .amount-input-wrapper input {
      padding-left: 36px !important;
      font-family: var(--font-pixel);
      font-size: 20px;
    }

    /* Account selector */
    .account-selector {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .account-option {
      flex: 1;
      min-width: 80px;
      padding: 14px 8px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      text-align: center;
      font-family: var(--font-text);
      font-size: 15px;
      transition: all 0.08s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .account-option:active { transform: translate(2px, 2px); }

    .account-option.selected {
      background: var(--text);
      color: #fff;
    }

    .account-option.selected .acc-icon { filter: invert(1); }

    /* Date display */
    .date-display {
      padding: 14px 12px;
      border: 2px solid var(--border);
      background: #f5f5f5;
      font-family: var(--font-text);
      font-size: 18px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Search */
    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .search-btn:active { transform: translate(1px, 1px); }

    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .search-bar.hidden { display: none; }
    .search-bar input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid var(--border);
      font-family: var(--font-text);
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    .search-clear {
      background: none;
      border: 2px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      padding: 8px 12px;
      color: var(--text);
    }

    /* Comments */
    .record-comments {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--text-light);
    }
    .comment-item {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 4px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.03);
      border-left: 3px solid var(--accent);
      word-break: break-word;
    }
    .comment-add-btn {
      background: none;
      border: 1px dashed var(--text-light);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-light);
      padding: 4px 8px;
      font-family: var(--font-text);
    }
    .comment-add-btn:active { color: var(--accent); border-color: var(--accent); }

    /* Record Images */
    .record-images {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .record-img-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border: 2px solid var(--border);
      cursor: pointer;
      image-rendering: auto;
    }
    .record-img-thumb:active { border-color: var(--accent); }
    .img-add-btn {
      background: none;
      border: 1px dashed var(--text-light);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-light);
      padding: 4px 8px;
      font-family: var(--font-text);
      margin-left: 4px;
    }
    .img-add-btn:active { color: var(--accent); border-color: var(--accent); }
    .img-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e74c3c;
      color: #fff;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .img-viewer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .img-viewer-overlay img {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
    }
    .img-viewer-close {
      margin-top: 16px;
      padding: 10px 32px;
      background: var(--border);
      color: var(--text);
      border: 2px solid var(--text);
      font-family: var(--font-pixel);
      font-size: 10px;
      cursor: pointer;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 16px;
      border: 3px solid var(--border);
      background: var(--card-bg);
      font-family: var(--font-pixel);
      font-size: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--border);
      transition: all 0.08s;
      color: var(--text);
    }

    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--border);
    }

    .btn-income {
      background: var(--income);
      color: #fff;
      border-color: var(--income);
      box-shadow: 4px 4px 0 #1a3a2a;
    }

    .btn-expense {
      background: var(--expense);
      color: #fff;
      border-color: var(--expense);
      box-shadow: 4px 4px 0 #5a0104;
    }

    .btn-salary {
      background: var(--salary);
      color: #fff;
      border-color: var(--salary);
      box-shadow: 4px 4px 0 #6b4e00;
    }

    .btn-small {
      padding: 10px 16px;
      font-size: 10px;
      width: auto;
      box-shadow: 3px 3px 0 var(--border);
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 3px 3px 0 #021f3d;
      margin-bottom: 12px;
    }

    .btn-transfer {
      background: var(--yellow);
      color: var(--text);
      border-color: #c4a800;
      box-shadow: 3px 3px 0 #c4a800;
      margin-bottom: 16px;
    }

    /* Transfer modal */
    .transfer-arrow {
      text-align: center;
      font-size: 24px;
      color: var(--text-light);
      margin: 4px 0;
    }

    .modal select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      font-family: var(--font-text);
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: flex-end;
    }

    .filter-item {
      flex: 1;
    }

    .filter-item label {
      display: block;
      font-family: var(--font-pixel);
      font-size: 7px;
      margin-bottom: 6px;
      color: var(--text-light);
    }

    .filter-item select {
      width: 100%;
      padding: 10px 8px;
      border: 2px solid var(--border);
      font-family: var(--font-text);
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }

    /* Details */
    .year-group { margin-bottom: 20px; }

    .year-header {
      font-family: var(--font-pixel);
      font-size: 12px;
      padding: 10px 12px;
      background: var(--text);
      color: #fff;
      margin-bottom: 8px;
    }

    .month-group { margin-bottom: 16px; margin-left: 8px; }

    .month-header {
      font-family: var(--font-pixel);
      font-size: 10px;
      padding: 8px 10px;
      background: var(--accent);
      color: #fff;
      margin-bottom: 6px;
    }

    .day-group { margin-bottom: 12px; margin-left: 8px; }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      padding: 6px 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 6px;
    }

    .day-header .day-num { font-weight: bold; }

    .day-header .day-summary { font-size: 13px; }

    .record-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      margin-bottom: 4px;
      background: var(--card-bg);
    }

    .record-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      font-family: var(--font-pixel);
    }

    .record-icon.income { background: var(--income-bg); color: var(--income); border-color: var(--income); }
    .record-icon.expense { background: var(--expense-bg); color: var(--expense); border-color: var(--expense); }
    .record-icon.transfer { background: var(--salary-bg); color: var(--salary); border-color: var(--salary); }

    .record-info { flex: 1; min-width: 0; }

    .record-note {
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record-meta {
      font-size: 12px;
      color: var(--text-light);
    }

    .record-amount {
      font-family: var(--font-pixel);
      font-size: 11px;
      white-space: nowrap;
    }

    .record-amount.income { color: var(--income); }
    .record-amount.expense { color: var(--expense); }
    .record-amount.transfer { color: var(--salary); }

    .delete-btn {
      background: none;
      border: 1px solid var(--text-light);
      cursor: pointer;
      font-size: 16px;
      color: var(--text-light);
      padding: 2px 8px;
      font-family: var(--font-text);
      flex-shrink: 0;
    }

    .delete-btn:hover { color: var(--expense); border-color: var(--expense); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* Chart */
    .chart-stats {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      flex: 1;
      border: 2px solid var(--border);
      padding: 12px;
      text-align: center;
      background: var(--card-bg);
    }

    .stat-box.income { border-color: var(--income); }
    .stat-box.income .stat-value { color: var(--income); }
    .stat-box.expense { border-color: var(--expense); }
    .stat-box.expense .stat-value { color: var(--expense); }

    .stat-label {
      font-family: var(--font-pixel);
      font-size: 8px;
      margin-bottom: 6px;
      color: var(--text-light);
    }

    .stat-value {
      font-family: var(--font-pixel);
      font-size: 13px;
    }

    .chart-container {
      border: 3px solid var(--border);
      background: var(--card-bg);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0 var(--border);
      height: 340px;
      position: relative;
    }

    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
    }

    .legend-dot.income { background: var(--income); }
    .legend-dot.expense { background: var(--expense); }

    /* Assets */
    .assets-total {
      border: 3px solid var(--border);
      background: var(--text);
      color: #fff;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0 var(--border);
    }

    .assets-total .label {
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--yellow);
      margin-bottom: 8px;
    }

    .assets-total .amount {
      font-family: var(--font-pixel);
      font-size: 20px;
      color: var(--yellow);
    }

    .asset-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 12px;
      border: 2px solid var(--border);
      margin-bottom: 8px;
      background: var(--card-bg);
    }

    .asset-icon-box {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: var(--font-pixel);
      font-size: 10px;
    }

    .asset-info { flex: 1; min-width: 0; }

    .asset-name {
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .asset-meta {
      font-size: 12px;
      color: var(--text-light);
    }

    .asset-amount {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--income);
      white-space: nowrap;
      text-align: right;
    }

    .asset-amount.negative {
      color: var(--expense);
    }

    .asset-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-top: 8px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      font-family: var(--font-text);
      color: var(--text);
    }

    .icon-btn:active { transform: translate(2px, 2px); }
    .icon-btn.danger { color: var(--expense); border-color: var(--expense); }

    /* Asset type selector */
    .type-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .type-option {
      flex: 1;
      min-width: 70px;
      padding: 10px 6px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      text-align: center;
      font-family: var(--font-text);
      font-size: 14px;
    }

    .type-option:active { transform: translate(2px, 2px); }
    .type-option.selected { background: var(--text); color: #fff; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 12px 24px;
      border: 2px solid var(--border);
      font-family: var(--font-text);
      font-size: 16px;
      z-index: 1000;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .toast.fadeOut {
      animation: toastOut 0.3s ease forwards;
    }

    @keyframes toastOut {
      to { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    /* Confirm modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(26,26,46,0.5);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.15s ease;
    }

    .modal {
      background: var(--bg);
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      padding: 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
    }

    .modal p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      font-family: var(--font-text);
      font-size: 16px;
      cursor: pointer;
      background: var(--card-bg);
    }

    .modal-btn:active { transform: translate(2px, 2px); }
    .modal-btn.confirm { background: var(--expense); color: #fff; }
    .modal-btn.save { background: var(--income); color: #fff; }

    .modal-form .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .spacer { width: 36px; flex-shrink: 0; }

    /* Salary history */
    .salary-history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border: 2px solid var(--salary);
      margin-bottom: 8px;
      background: var(--salary-bg);
    }

    .salary-history-icon {
      width: 36px;
      height: 36px;
      border: 2px solid var(--salary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-pixel);
      font-size: 12px;
      color: var(--salary);
      flex-shrink: 0;
    }

    .salary-history-info { flex: 1; }

    .salary-history-date {
      font-size: 16px;
    }

    .salary-history-meta {
      font-size: 12px;
      color: var(--text-light);
    }

    .salary-history-amount {
      font-family: var(--font-pixel);
      font-size: 12px;
      color: var(--salary);
    }

    .section-title {
      font-family: var(--font-pixel);
      font-size: 10px;
      margin: 16px 0 12px;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }
  </style>
</head>

  <script>
    // ==================== Data ====================
    // Version check: clear old data on version upgrade
    const DATA_VERSION = 'v2_clean';
    if (localStorage.getItem('facai_data_version') !== DATA_VERSION) {
      localStorage.removeItem('facai_records');
      localStorage.removeItem('facai_assets');
      localStorage.removeItem('facai_salary');
      localStorage.removeItem('facai_salary_last_date');
      localStorage.setItem('facai_data_version', DATA_VERSION);
    }

    let records = JSON.parse(localStorage.getItem('facai_records') || '[]');
    let assets = JSON.parse(localStorage.getItem('facai_assets') || '[]');
    let salaryHistory = JSON.parse(localStorage.getItem('facai_salary') || '[]');
    let salaryLastDate = localStorage.getItem('facai_salary_last_date') || '';
    let currentType = 'income';
    let currentAccount = 'bank';
    let salaryAccount = 'bank';
    let chartInstance = null;

    // Initialize on first load - empty records, zero-amount assets for user to edit
    if (records.length === 0 && assets.length === 0 && salaryHistory.length === 0) {
      saveRecords();
      saveSalaryData();

      // Default assets with 0 amounts
      assets = [

    // ==================== Utilities ====================
    function formatDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatCurrency(amount) {
      return '¥' + Number(amount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function saveRecords() {
      localStorage.setItem('facai_records', JSON.stringify(records));
    }

    function saveAssets() {
      localStorage.setItem('facai_assets', JSON.stringify(assets));
    }

    function saveSalaryData() {
      localStorage.setItem('facai_salary', JSON.stringify(salaryHistory));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getAccountText(account) {
      if (account === 'bank') return '银行卡';
      if (account === 'wechat') return '微信';
      if (account === 'alipay') return '支付宝';
      if (account === 'cash') return '现金';
      // If it's a specific bank card name, return it directly
      return account;
    }

    function exportToXLS(btn) {
      // Build XLS (Excel compatible HTML table) with multiple sheets via separate tables
      let html = '';

      // Sheet 1: Records
      html += '<table border="1">';
      html += '<tr style="background-color:#0353a4;color:#fff;font-weight:bold"><td colspan="5" style="font-size:14px;padding:8px">记账记录</td></tr>';
      html += '<tr style="background-color:#e0e0e0;font-weight:bold"><td>日期</td><td>类型</td><td>金额</td><td>备注</td><td>账号</td></tr>';
      records.forEach(function(r) {
        html += '<tr>';
        html += '<td style="padding:4px">' + escapeHtml(r.date) + '</td>';
        html += '<td style="padding:4px">' + (r.type === 'income' ? '收入' : r.type === 'transfer' ? '转账' : '支出') + '</td>';
        html += '<td style="padding:4px;text-align:right">' + r.amount.toFixed(2) + '</td>';
        html += '<td style="padding:4px">' + escapeHtml(r.note) + '</td>';
        html += '<td style="padding:4px">' + escapeHtml(getAccountText(r.account)) + '</td>';
        html += '</tr>';
      });
      html += '</table>';

      // Spacer between tables
      html += '<br><br>';

      // Sheet 2: Assets
      html += '<table border="1">';
      html += '<tr style="background-color:#0353a4;color:#fff;font-weight:bold"><td colspan="4" style="font-size:14px;padding:8px">资产</td></tr>';
      html += '<tr style="background-color:#e0e0e0;font-weight:bold"><td>名称</td><td>类型</td><td>金额</td><td>备注</td></tr>';
      assets.forEach(function(a) {
        html += '<tr>';
        html += '<td style="padding:4px">' + escapeHtml(a.name) + '</td>';
        html += '<td style="padding:4px">' + escapeHtml(getAssetTypeLabel(a.type)) + '</td>';
        html += '<td style="padding:4px;text-align:right">' + a.amount.toFixed(2) + '</td>';
        html += '<td style="padding:4px">' + (a.amount < 0 ? '负债' : '资产') + '</td>';
        html += '</tr>';
      });
      const totalAssets = assets.reduce(function(s, a) { return s + a.amount; }, 0);
      html += '<tr style="font-weight:bold;background-color:#f0f0f0"><td colspan="2" style="padding:4px">总计</td><td style="padding:4px;text-align:right">' + totalAssets.toFixed(2) + '</td><td></td></tr>';
      html += '</table>';

      html += '<br><br>';

      // Sheet 3: Salary History
      html += '<table border="1">';
      html += '<tr style="background-color:#0353a4;color:#fff;font-weight:bold"><td colspan="3" style="font-size:14px;padding:8px">发薪记录</td></tr>';
      html += '<tr style="background-color:#e0e0e0;font-weight:bold"><td>日期</td><td>金额</td><td>账号</td></tr>';
      salaryHistory.forEach(function(s) {
        html += '<tr>';
        html += '<td style="padding:4px">' + escapeHtml(s.date) + '</td>';
        html += '<td style="padding:4px;text-align:right">' + s.amount.toFixed(2) + '</td>';
        html += '<td style="padding:4px">' + escapeHtml(getAccountText(s.account)) + '</td>';
        html += '</tr>';
      });
      html += '</table>';

      // Generate XLS file
      const xlsContent = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>' + html + '</body></html>';
      const blob = new Blob(['\ufeff' + xlsContent], { type: 'application/vnd.ms-excel' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '发财_数据导出_' + formatDateStr(new Date()) + '.xls';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      btn.closest('.modal-overlay').remove();
      showToast('数据已导出');
    }

    // ==================== Data Import ====================
    function importData() {
      closeSettings();
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <p style="font-family:var(--font-pixel);font-size:12px;margin-bottom:12px">数据导入</p>
          <p style="font-size:14px;color:var(--text-light);margin-bottom:16px">选择之前导出的 JSON 文件，导入后将覆盖当前数据</p>
          <div class="modal-buttons">
            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="modal-btn save" onclick="document.getElementById('import-file-input').click()">选择文件</button>
          </div>
          <input type="file" id="import-file-input" accept=".json" style="display:none">
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
      });

      document.getElementById('import-file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.records) records = data.records;
            if (data.assets) assets = data.assets;
            if (data.salaryHistory) salaryHistory = data.salaryHistory;
            if (data.salaryLastDate !== undefined) salaryLastDate = data.salaryLastDate;
            saveRecords();
            saveAssets();
            saveSalaryData();
            localStorage.setItem('facai_salary_last_date', salaryLastDate);
            overlay.remove();
            updateMainView();
            showToast('数据导入成功 ✓');
          } catch(err) {
            showToast('文件格式错误');
          }
        };
        reader.readAsText(file);
      });
    }

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

      a.download = '发财_数据备份_' + formatDateStr(new Date()) + '.json';

      URL.revokeObjectURL(url);
    }

    function saveRecord() {
      const amount = parseFloat(document.getElementById('amount-input').value);
      const note = document.getElementById('note-input').value.trim() || '无备注';
      const dateInput = document.getElementById('date-input').value;
      const recordDate = dateInput || formatDateStr(new Date());

      if (!amount || amount <= 0) {
        showToast('请输入有效金额');
        return;
      }

      const record = {
        id: Date.now(),
        type: currentType,
        amount: amount,
        note: note,
        account: currentAccount,
        date: recordDate,
        comments: []
      };

      records.unshift(record);
      saveRecords();

      // Auto-update asset balance
      updateAssetForRecord(record);

      showToast(currentType === 'income' ? '收入已记录 ✓' : '支出已记录 ✓');
      showView('main-view');
    }

    function updateAssetForRecord(record) {
      let matchedAsset = null;
      assets.forEach(a => {
        if (a.name === record.account) {
          matchedAsset = a;
        } else if (record.account === 'bank' && a.type === 'bank') {
          matchedAsset = a;
        } else if (record.account === 'wechat' && a.type === 'wechat') {
          matchedAsset = a;
        } else if (record.account === 'alipay' && a.type === 'alipay') {
          matchedAsset = a;
        } else if (record.account === 'cash' && a.type === 'cash') {
          matchedAsset = a;
        }
      });
      if (matchedAsset) {
        if (record.type === 'income') {
          matchedAsset.amount += record.amount;
        } else {
          matchedAsset.amount -= record.amount;
        }
        saveAssets();
      }
    }

    let salarySaving = false;
    function saveSalary() {
      if (salarySaving) return;
      const date = document.getElementById('salary-date-input').value;
      const amount = parseFloat(document.getElementById('salary-amount-input').value);

      if (!date) {
        showToast('请选择日期');
        return;
      }
      if (!amount || amount <= 0) {
        showToast('请输入有效金额');
        return;
      }

      // Check for duplicate (same date + same amount)
      const isDuplicate = salaryHistory.some(s => s.date === date && s.amount === amount);
      if (isDuplicate) {
        showSalaryDuplicateConfirm(date, amount);
        return;
      }

      doSaveSalary(date, amount);
    }

    function showSalaryDuplicateConfirm(date, amount) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <p>该日期已存在相同金额的发薪记录，确认再次添加？</p>
          <div class="modal-buttons">
            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="modal-btn save" onclick="doSaveSalary('${date}', ${amount}); this.closest('.modal-overlay').remove()">确认添加</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
      });
    }

    function doSaveSalary(date, amount) {
      salarySaving = true;

      const salaryId = Date.now();
      const salaryRecord = {
        id: salaryId,
        date: date,
        amount: amount,
        account: salaryAccount
      };
      salaryHistory.unshift(salaryRecord);
      saveSalaryData();

      salaryLastDate = date;
      localStorage.setItem('facai_salary_last_date', salaryLastDate);

      const incomeRecord = {
        id: salaryId + 1,
        type: 'income',
        amount: amount,
        note: '发薪',
        account: salaryAccount,
        date: date,
        isSalary: true,
        salaryId: salaryId
      };
      records.unshift(incomeRecord);
      saveRecords();

      // Show success modal
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <p style="color:var(--salary);font-size:18px">发薪保存成功！</p>
          <p style="font-size:14px;color:var(--text-light)">日期：${date}<br>金额：${formatCurrency(amount)}<br>账号：${getAccountText(salaryAccount)}</p>

    // ==================== Main View ====================
    function updateMainView() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      let incomeTotal = 0, expenseTotal = 0;
      let incomeCount = 0, expenseCount = 0;

      records.forEach(r => {
        if (r.type === 'transfer') return;
        const d = new Date(r.date);
        if (d.getFullYear() === year && d.getMonth() === month) {
          if (r.type === 'income') { incomeTotal += r.amount; incomeCount++; }
          else { expenseTotal += r.amount; expenseCount++; }
        }
      });

      document.getElementById('income-total').textContent = formatCurrency(incomeTotal);
      document.getElementById('expense-total').textContent = formatCurrency(expenseTotal);

      const net = incomeTotal - expenseTotal;
      const netEl = document.getElementById('net-balance');
      netEl.textContent = (net >= 0 ? '+' : '') + formatCurrency(net);
      netEl.className = 'amount ' + (net >= 0 ? 'positive' : 'negative');

      document.getElementById('income-sub').textContent = incomeCount > 0 ? `本月 ${incomeCount} 笔收入` : '本月暂无收入';
      document.getElementById('expense-sub').textContent = expenseCount > 0 ? `本月 ${expenseCount} 笔支出` : '本月暂无支出';

      // Salary sub text
      const salarySub = document.getElementById('salary-sub');
      if (salaryLastDate) {
        const lastD = new Date(salaryLastDate);
        salarySub.textContent = `上次发薪 ${lastD.getMonth() + 1}月${lastD.getDate()}日`;
      } else {
        salarySub.textContent = '点击记录发薪';
      }
    }

      return Array.from(years).sort((a, b) => b - a);

    function renderDetails() {
      const container = document.getElementById('details-content');
      const yearSelect = document.getElementById('details-year-select');
      const monthSelect = document.getElementById('details-month-select');
      const searchInput = document.getElementById('search-input');
      const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';

      if (!yearSelect.options.length) return;

      const filterYear = parseInt(yearSelect.value);
      const filterMonth = monthSelect.value; // 'all' or 0-11

      let filtered = records.filter(r => {
        const d = new Date(r.date);
        if (d.getFullYear() !== filterYear) return false;
        if (filterMonth !== 'all' && d.getMonth() !== parseInt(filterMonth)) return false;
        if (searchTerm) {
          const noteMatch = r.note.toLowerCase().includes(searchTerm);
          const commentMatch = (r.comments || []).some(c => c.toLowerCase().includes(searchTerm));
          if (!noteMatch && !commentMatch) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
                <rect x="4" y="2" width="8" height="1" fill="#1a1a2e"/>
                <rect x="3" y="3" width="10" height="1" fill="#1a1a2e"/>

                <rect x="5" y="7" width="2" height="1" fill="#1a1a2e"/>
                <rect x="9" y="7" width="2" height="1" fill="#1a1a2e"/>
                <rect x="6" y="10" width="4" height="1" fill="#1a1a2e"/>
              </svg>
            </div>
            <p>${searchTerm ? '没有找到匹配的记录' : '该时间段没有记录'}</p>
          </div>
        `;
        return;
      }

      const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id);

      // Group by year > month > day
      const grouped = {};
      sorted.forEach(r => {
        const d = new Date(r.date);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const day = d.getDate();
        if (!grouped[y]) grouped[y] = {};
        if (!grouped[y][m]) grouped[y][m] = {};
        if (!grouped[y][m][day]) grouped[y][m][day] = [];
        grouped[y][m][day].push(r);
      });

      let html = '';
      Object.keys(grouped).sort((a, b) => b - a).forEach(year => {
        html += `<div class="year-group"><div class="year-header">${year}年</div>`;

        Object.keys(grouped[year]).sort((a, b) => b - a).forEach(month => {
          html += `<div class="month-group"><div class="month-header">${month}月</div>`;

          Object.keys(grouped[year][month]).sort((a, b) => b - a).forEach(day => {
            const dayRecords = grouped[year][month][day];
            const dayIncome = dayRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
            const dayExpense = dayRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
            html += `<div class="day-group">`;
            html += `<div class="day-header"><span class="day-num">${day}日</span><span class="day-summary">`;
            if (dayIncome > 0) html += `<span style="color:var(--income)">+${formatCurrency(dayIncome)}</span> `;
            if (dayExpense > 0) html += `<span style="color:var(--expense)">-${formatCurrency(dayExpense)}</span>`;
            html += `</span></div>`;

            dayRecords.forEach(r => {
              const accountText = getAccountText(r.account);
              let icon, iconClass, amountPrefix, amountClass, recordMeta;
              if (r.type === 'transfer') {
                icon = '⇄';
                iconClass = 'transfer';
                amountPrefix = '';
                amountClass = 'transfer';
                recordMeta = `${escapeHtml(r.account)} → ${escapeHtml(r.toAccount || '')}`;
              } else {
                icon = r.type === 'income' ? '↑' : '↓';
                iconClass = r.type;
                amountPrefix = r.type === 'income' ? '+' : '-';
                amountClass = r.type;
                recordMeta = accountText;
              }
              const comments = r.comments || [];
              const images = r.images || [];
              let commentHtml = '';
              if (comments.length > 0) {
                commentHtml += '<div class="record-comments">';
                comments.forEach((c, i) => {
                  commentHtml += `<div class="comment-item">${escapeHtml(c)}</div>`;
                });
                commentHtml += '</div>';
              }
              let imageHtml = '';
              if (images.length > 0) {
                imageHtml += '<div class="record-images">';
                images.forEach((src, i) => {
                  imageHtml += `<img class="record-img-thumb" src="${src}" onclick="viewImage(${r.id}, ${i})" ontouchstart="startLongPress(${r.id}, ${i})" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()" onmousedown="startLongPress(${r.id}, ${i})" onmouseup="cancelLongPress()" onmouseleave="cancelLongPress()">`;
                });
                imageHtml += '</div>';
              }
              html += `
                <div class="record-item" style="flex-wrap:wrap">
                  <div class="record-icon ${iconClass}">${icon}</div>
                  <div class="record-info">
                    <div class="record-note">${escapeHtml(r.note)}</div>
                    <div class="record-meta">${recordMeta}</div>
                  </div>
                  <div class="record-amount ${amountClass}">${amountPrefix}${formatCurrency(r.amount)}</div>
                  <button class="delete-btn" onclick="confirmDelete(${r.id})">删除</button>
                  <div style="width:100%">
                    ${commentHtml}
                    ${imageHtml}
                    <button class="comment-add-btn" onclick="addComment(${r.id})">+ 评论</button>
                    <button class="img-add-btn" onclick="addImage(${r.id})">+ 图片</button>
                  </div>
                </div>
              `;
            });

            html += `</div>`;
          });

          html += `</div>`;
        });

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    function addComment(recordId) {

          <p style="font-family:var(--font-pixel);font-size:10px;margin-bottom:12px">添加评论</p>

    function saveComment(recordId, btn) {
      const text = document.getElementById('comment-input').value.trim();
      if (!text) {
        showToast('请输入评论内容');
        return;
      }
      const record = records.find(r => r.id === recordId);

        saveRecords();

    // ==================== Images ====================
    function addImage(recordId) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
          showToast('图片不能超过5MB');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(ev) {
          const record = records.find(r => r.id === recordId);
          if (record) {
            if (!record.images) record.images = [];
            record.images.push(ev.target.result);
            saveRecords();
            renderDetails();
            showToast('图片已添加');
          }
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

      const record = records.find(r => r.id === recordId);
      if (record && record.images) {
        record.images.splice(index, 1);
        saveRecords();
        renderDetails();
        showToast('图片已删除');
      }
    }

    // ==================== Delete ====================
    function confirmDelete(id) {
      const record = records.find(r => r.id === id);
      if (!record) return;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">

          <div class="modal-buttons">

      });

    function deleteRecord(id, btn) {
      const record = records.find(r => r.id === id);
      if (record) {
        if (record.type === 'transfer') {
          // Reverse transfer: add back to source, remove from destination
          const fromAsset = assets.find(a => a.name === record.account);
          const toAsset = assets.find(a => a.name === record.toAccount);
          if (fromAsset) fromAsset.amount += record.amount;
          if (toAsset) toAsset.amount -= record.amount;
          saveAssets();
        } else {
          // Reverse asset update for income/expense
          let matchedAsset = null;
          assets.forEach(a => {
            if (a.name === record.account || (record.account === 'bank' && a.type === 'bank') ||
                (record.account === 'wechat' && a.type === 'wechat') || (record.account === 'alipay' && a.type === 'alipay') ||
                (record.account === 'cash' && a.type === 'cash')) {
              matchedAsset = a;
            }
          });
          if (matchedAsset) {
            if (record.type === 'income') matchedAsset.amount -= record.amount;
            else matchedAsset.amount += record.amount;
            saveAssets();
          }
        }
      }
      records = records.filter(r => r.id !== id);
      saveRecords();
      btn.closest('.modal-overlay').remove();
      renderDetails();
      showToast('已删除');
    }

      if (prevYear && years.includes(parseInt(prevYear))) {

    // ==================== Chart ====================
    function renderChart() {
      const yearSelect = document.getElementById('chart-year-select');
      const monthSelect = document.getElementById('chart-month-select');

      if (!yearSelect.options.length) return;

      const filterYear = parseInt(yearSelect.value);
      const filterMonth = parseInt(monthSelect.value);
      const daysInMonth = new Date(filterYear, filterMonth + 1, 0).getDate();

      const labels = [];
      const incomeData = [];
      const expenseData = [];

      for (let day = 1; day <= daysInMonth; day++) {
        labels.push(`${day}日`);
        let income = 0, expense = 0;
        const dateStr = `${filterYear}-${String(filterMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        records.forEach(r => {
          if (r.date === dateStr) {
            if (r.type === 'income') income += r.amount;
            else if (r.type === 'expense') expense += r.amount;
          }
        });
        incomeData.push(income);
        expenseData.push(expense);
      }

      const totalIncome = incomeData.reduce((s, v) => s + v, 0);
      const totalExpense = expenseData.reduce((s, v) => s + v, 0);

      document.getElementById('chart-income-label').textContent = `${filterMonth + 1}月收入`;
      document.getElementById('chart-expense-label').textContent = `${filterMonth + 1}月支出`;
      document.getElementById('chart-income-total').textContent = formatCurrency(totalIncome);
      document.getElementById('chart-expense-total').textContent = formatCurrency(totalExpense);

      const ctx = document.getElementById('line-chart').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '收入',
              data: incomeData,
              borderColor: '#2d6a4f',
              backgroundColor: 'rgba(45,106,79,0.08)',
              borderWidth: 2,
              tension: 0,
              pointRadius: daysInMonth > 20 ? 2 : 4,
              pointHoverRadius: 6,
              pointBackgroundColor: '#2d6a4f',
              pointBorderColor: '#1a1a2e',
              pointBorderWidth: 1,
              fill: true
            },
            {
              label: '支出',
              data: expenseData,
              borderColor: '#9d0208',
              backgroundColor: 'rgba(157,2,8,0.08)',
              borderWidth: 2,
              tension: 0,
              pointRadius: daysInMonth > 20 ? 2 : 4,
              pointHoverRadius: 6,
              pointBackgroundColor: '#9d0208',
              pointBorderColor: '#1a1a2e',
              pointBorderWidth: 1,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              titleFont: { family: 'monospace', size: 13 },
              bodyFont: { family: 'monospace', size: 13 },
              borderColor: '#1a1a2e',
              borderWidth: 2,
              padding: 10,
              callbacks: {
                label: function(ctx) {
                  return ctx.dataset.label + ': ¥' + ctx.parsed.y.toFixed(2);
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(26,26,46,0.08)', lineWidth: 1 },
              ticks: {
                font: { family: 'monospace', size: 9 },
                color: '#1a1a2e',
                maxRotation: 0,
                autoSkip: true,
                maxTicksLimit: 15
              },
              border: { color: '#1a1a2e', width: 2 }
            },
            y: {
              grid: { color: 'rgba(26,26,46,0.08)', lineWidth: 1 },
              ticks: {
                font: { family: 'monospace', size: 12 },
                color: '#1a1a2e',
                callback: function(v) { return '¥' + v; }
              },
              beginAtZero: true,
              border: { color: '#1a1a2e', width: 2 }
            }
          }
        }
      });
    }

    // ==================== Assets ====================
    function getAssetTypeLabel(type) {
      if (type === 'bank') return '银行卡';
      if (type === 'wechat') return '微信';
      if (type === 'alipay') return '支付宝';
      if (type === 'cash') return '现金';
      return '其他';
    }

    function getAssetTypeIcon(type) {
      const icons = {
        bank: '银',
        wechat: '微',
        alipay: '支',
        cash: '现',
        other: '其'
      };
      return icons[type] || '其';
    }

    function renderAssets() {
      const list = document.getElementById('assets-list');
      const total = assets.reduce((s, a) => s + a.amount, 0);
      const totalEl = document.getElementById('assets-total');
      totalEl.textContent = formatCurrency(total);
      totalEl.style.color = total < 0 ? 'var(--expense)' : 'var(--yellow)';

      if (assets.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
                <rect x="5" y="2" width="6" height="1" fill="#1a1a2e"/>
                <rect x="4" y="3" width="8" height="1" fill="#1a1a2e"/>
                <rect x="3" y="4" width="10" height="8" fill="#fff" stroke="#1a1a2e" stroke-width="1"/>
                <rect x="5" y="6" width="6" height="1" fill="#1a1a2e"/>
                <rect x="5" y="8" width="4" height="1" fill="#1a1a2e"/>
                <rect x="5" y="10" width="6" height="1" fill="#1a1a2e"/>
              </svg>
            </div>
            <p>还没有添加资产</p>
            <p style="margin-top:8px;font-size:14px">点击上方按钮添加资产</p>
          </div>
        `;
        return;
      }

      list.innerHTML = assets.map(a => `
        <div class="asset-item" onclick="showAssetRecords(${a.id})" style="cursor:pointer">
          <div class="asset-icon-box">${getAssetTypeIcon(a.type)}</div>
          <div class="asset-info">
            <div class="asset-name">${escapeHtml(a.name)}</div>
            <div class="asset-meta">${getAssetTypeLabel(a.type)}</div>
            <div class="asset-actions">
              <button class="icon-btn" onclick="event.stopPropagation(); openAssetModal(${a.id})">编辑</button>
              <button class="icon-btn danger" onclick="event.stopPropagation(); confirmDeleteAsset(${a.id})">删除</button>
            </div>
          </div>
          <div class="asset-amount${a.amount < 0 ? ' negative' : ''}">${formatCurrency(a.amount)}</div>
        </div>
      `).join('');
    }

    function showAssetRecords(assetId) {
      const asset = assets.find(a => a.id === assetId);
      if (!asset) return;

      document.getElementById('asset-records-title').textContent = asset.name;
      document.getElementById('asset-records-balance-label').textContent = '当前余额';
      const balEl = document.getElementById('asset-records-balance');
      balEl.textContent = formatCurrency(asset.amount);
      balEl.style.color = asset.amount < 0 ? 'var(--expense)' : 'var(--yellow)';

      // Find all records linked to this asset (including transfers)
      const linked = records.filter(r => {
        if (r.type === 'transfer') {
          return r.account === asset.name || r.toAccount === asset.name ||
                 (r.account === 'bank' && asset.type === 'bank') ||
                 (r.toAccount === 'bank' && asset.type === 'bank');
        }
        return r.account === asset.name ||
               (r.account === 'bank' && asset.type === 'bank') ||
               (r.account === 'wechat' && asset.type === 'wechat') ||
               (r.account === 'alipay' && asset.type === 'alipay') ||
               (r.account === 'cash' && asset.type === 'cash');
      });

      const container = document.getElementById('asset-records-content');

      if (linked.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>暂无交易记录</p>
            <p style="margin-top:8px;font-size:14px">使用此资产的收支会显示在这里</p>
          </div>
        `;
        showView('asset-records-view');
        return;
      }

      const sorted = [...linked].sort((a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id);

      let html = '';
      sorted.forEach(r => {
        let icon, iconClass, amountPrefix, amountClass;
        if (r.type === 'transfer') {
          icon = '⇄';
          iconClass = 'transfer';
          amountPrefix = '';
          amountClass = 'transfer';
        } else {
          icon = r.type === 'income' ? '↑' : '↓';
          iconClass = r.type;
          amountPrefix = r.type === 'income' ? '+' : '-';
          amountClass = r.type;
        }
        html += `
          <div class="record-item">
            <div class="record-icon ${iconClass}">${icon}</div>
            <div class="record-info">
              <div class="record-note">${escapeHtml(r.note)}</div>
              <div class="record-meta">${r.date}</div>
            </div>
            <div class="record-amount ${amountClass}">${amountPrefix}${formatCurrency(r.amount)}</div>
          </div>
        `;
      });

      container.innerHTML = html;
      showView('asset-records-view');
    }

    function openAssetModal(id) {
      const isEdit = id !== undefined;
      const asset = isEdit ? assets.find(a => a.id === id) : null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal modal-form">
          <p>${isEdit ? '编辑资产' : '添加资产'}</p>
          <div class="form-group">
            <label style="font-family:var(--font-pixel);font-size:8px;margin-bottom:8px;color:var(--text-light)">名称</label>
            <input type="text" id="asset-name-input" placeholder="如：工商银行储蓄卡" maxlength="20" value="${asset ? escapeHtml(asset.name) : ''}" style="width:100%;padding:12px;border:2px solid var(--border);font-family:var(--font-text);font-size:16px;background:var(--card-bg);color:var(--text);outline:none">
          </div>
          <div class="form-group">
            <label style="font-family:var(--font-pixel);font-size:8px;margin-bottom:8px;color:var(--text-light)">类型</label>
            <div class="type-selector" id="asset-type-selector">
              <div class="type-option ${(!asset || asset.type === 'bank') ? 'selected' : ''}" data-type="bank" onclick="selectAssetType(this)">银行卡</div>
              <div class="type-option ${asset && asset.type === 'wechat' ? 'selected' : ''}" data-type="wechat" onclick="selectAssetType(this)">微信</div>
              <div class="type-option ${asset && asset.type === 'alipay' ? 'selected' : ''}" data-type="alipay" onclick="selectAssetType(this)">支付宝</div>
              <div class="type-option ${asset && asset.type === 'cash' ? 'selected' : ''}" data-type="cash" onclick="selectAssetType(this)">现金</div>
              <div class="type-option ${asset && asset.type === 'other' ? 'selected' : ''}" data-type="other" onclick="selectAssetType(this)">其他</div>
            </div>
          </div>
          <div class="form-group">
            <label style="font-family:var(--font-pixel);font-size:8px;margin-bottom:8px;color:var(--text-light)">金额</label>
            <div class="amount-input-wrapper">
              <input type="number" id="asset-amount-input" placeholder="0.00 (负数为负债)" step="0.01" value="${asset ? asset.amount : ''}" style="width:100%;padding:12px 12px 12px 36px;border:2px solid var(--border);font-family:var(--font-pixel);font-size:18px;background:var(--card-bg);color:var(--text);outline:none">
            </div>
          </div>
          <div class="modal-buttons">
            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="modal-btn save" onclick="saveAsset(${isEdit ? id : 'null'}, this)">保存</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
      });
    }

    function selectAssetType(el) {
      document.querySelectorAll('#asset-type-selector .type-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    function saveAsset(id, btn) {
      const name = document.getElementById('asset-name-input').value.trim();
      const amount = parseFloat(document.getElementById('asset-amount-input').value);
      const typeEl = document.querySelector('#asset-type-selector .type-option.selected');
      const type = typeEl ? typeEl.dataset.type : 'bank';

      if (!name) {
        showToast('请输入资产名称');
        return;
      }
      if (isNaN(amount)) {
        showToast('请输入有效金额');
        return;
      }

      if (id) {
        // Edit
        const asset = assets.find(a => a.id === id);
        if (asset) {
          asset.name = name;
          asset.amount = amount;
          asset.type = type;
        }
      } else {
        // Add
        assets.push({
          id: Date.now(),
          name: name,
          type: type,
          amount: amount
        });
      }

      saveAssets();
      btn.closest('.modal-overlay').remove();
      renderAssets();
      showToast(id ? '资产已更新 ✓' : '资产已添加 ✓');
    }

    function confirmDeleteAsset(id) {
      const asset = assets.find(a => a.id === id);
      if (!asset) return;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <p>确认删除「${escapeHtml(asset.name)}」？</p>
          <div class="modal-buttons">
            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="modal-btn confirm" onclick="deleteAsset(${id}, this)">删除</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
      });
    }

    function deleteAsset(id, btn) {
      assets = assets.filter(a => a.id !== id);
      saveAssets();
      btn.closest('.modal-overlay').remove();
      renderAssets();
      showToast('已删除');
    }

    // ==================== Transfer ====================
    function openTransferModal() {
      if (assets.length < 2) {
        showToast('至少需要2个资产才能转账');
        return;
      }

      const options = assets.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${formatCurrency(a.amount)})</option>`).join('');

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <p style="font-family:var(--font-pixel);font-size:12px;margin-bottom:16px">资产转账</p>
          <div class="form-group">
            <label style="font-family:var(--font-pixel);font-size:8px;margin-bottom:8px;color:var(--text-light)">转出账户</label>
            <select id="transfer-from">${options}</select>
          </div>
          <div class="transfer-arrow">↓</div>
          <div class="form-group">
            <label style="font-family:var(--font-pixel);font-size:8px;margin-bottom:8px;color:var(--text-light)">转入账户</label>
            <select id="transfer-to">${options}</select>
          </div>
          <div class="form-group">
            <label style="font-family:var(--font-pixel);font-size:8px;margin-bottom:8px;color:var(--text-light)">转账金额</label>
            <div class="amount-input-wrapper">
              <input type="number" id="transfer-amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal" autocomplete="off" style="width:100%;padding:12px 12px 12px 36px;border:2px solid var(--border);font-family:var(--font-pixel);font-size:18px;background:var(--card-bg);color:var(--text);outline:none">
            </div>
          </div>
          <div class="modal-buttons">
            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="modal-btn save" onclick="executeTransfer(this)">确认转账</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
      });

      // Default: second asset as target
      const toSelect = document.getElementById('transfer-to');
      if (toSelect.options.length > 1) toSelect.selectedIndex = 1;
    }

    function executeTransfer(btn) {
      const fromId = parseInt(document.getElementById('transfer-from').value);
      const toId = parseInt(document.getElementById('transfer-to').value);
      const amount = parseFloat(document.getElementById('transfer-amount').value);

      if (fromId === toId) {
        showToast('转出和转入账户不能相同');
        return;
      }
      if (!amount || amount <= 0) {
        showToast('请输入有效金额');
        return;
      }

      const fromAsset = assets.find(a => a.id === fromId);
      const toAsset = assets.find(a => a.id === toId);
      if (!fromAsset || !toAsset) return;

      if (fromAsset.amount < amount) {
        showToast('余额不足');
        return;
      }

      fromAsset.amount -= amount;
      toAsset.amount += amount;
      saveAssets();

      // Create a transfer record (not counted in income/expense totals)
      const transferRecord = {
        id: Date.now(),
        type: 'transfer',
        amount: amount,
        note: `转账：${fromAsset.name} → ${toAsset.name}`,
        account: fromAsset.name,
        toAccount: toAsset.name,
        date: formatDateStr(new Date()),
        comments: []
      };
      records.unshift(transferRecord);
      saveRecords();

      btn.closest('.modal-overlay').remove();
      renderAssets();

      // Success modal
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <p style="color:var(--income);font-size:18px">转账成功！</p>
          <p style="font-size:14px;color:var(--text-light)">
            从「${escapeHtml(fromAsset.name)}」<br>
            转入「${escapeHtml(toAsset.name)}」<br>
            金额：${formatCurrency(amount)}
          </p>
          <div class="modal-buttons">
            <button class="modal-btn save" onclick="this.closest('.modal-overlay').remove()">确定</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ==================== Toast ====================
    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('fadeOut');
        setTimeout(() => toast.remove(), 300);
      }, 1500);
    }

    // ==================== Init ====================
    updateMainView();
  </script>
</body>
</html>
